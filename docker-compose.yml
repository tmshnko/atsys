services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${DB_NAME}
      CLICKHOUSE_USER: ${DB_USER}
      CLICKHOUSE_PASSWORD: ${DB_PSWD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
    networks:
      - atsys_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-init:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-init
    environment:
      CLICKHOUSE_USER: $DB_USER
      CLICKHOUSE_PASSWORD: $DB_PSWD
      CH_PORT: $CH_PORT
    volumes:
      - ./scripts/clickhouse_init.sh:/init.sh:ro
      - ./sql/sys_metrics:/sql:ro

    entrypoint: ["/bin/bash", "/init.sh"]

    networks:
      - atsys_net
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    container_name: grafana
    image: grafana/grafana-enterprise
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS}
      CH_PORT: ${CH_PORT}
      GRAFANA_CH_USER: ${GRAFANA_CH_USER}
      GRAFANA_CH_PASSWORD: ${GRAFANA_CH_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana_config.yml:/etc/grafana/provisioning/datasources/clickhouse.yml:ro
      - ./grafana/grafana_dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/system_metrics.json:/var/lib/grafana/dashboards/system_metrics.json:ro
    networks:
      - atsys_net
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      
networks:
  atsys_net:
    driver: bridge

volumes:
  ch_data:
  ch_logs:
  grafana_data:
